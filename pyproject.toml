[project]
name = "quip2md"
version = "0.1.0"
description = "Bulk-export a Quip account to Markdown, mirroring folder structure."
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "markdownify",
    "python-dotenv",
    "markdown>=3.10.2",
    "markdown-it-py>=4.0.0",
    "lxml>=6.1.1",
]

[project.scripts]
quip2md = "quip2md.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quip2md"]

[tool.pytest.ini_options]
# 4 workers matches the performance-core count of the development machines
# (4P+4E Apple Silicon); -n 8 oversubscribes and measures slower.
addopts = "-n 4"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# scripts/recon.py is a one-shot recon utility whose stdlib socket
# monkeypatch (sandbox DNS workaround) cannot satisfy strict typing.
# The shipped package and tests remain fully checked.
exclude = ["scripts"]
